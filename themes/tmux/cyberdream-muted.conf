# cyberdream-muted for tmux (simple style, matches this repo's theme.conf structure)
# Muted palette: bg #16181a, surface #1e2124, overlay #3c4048, fg #ffffff, grey #7b8496, blue #78a8e8
set -g status-style bg=#16181a,fg=#ffffff
set -g pane-border-style bg=default,fg=#3c4048
set -g pane-active-border-style bg=default,fg=#78a8e8
set -g message-style bg=#1e2124,fg=#ffffff
setw -g window-status-activity-style bg=#16181a,fg=#7b8496
setw -g window-status-current-style bg=#1e2124,fg=#78a8e8
setw -g mode-style bg=#78a8e8,fg=#16181a
